[package]
name = "phonon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure-Rust audio DSP core: AudioBuffer, EQ, fade, mix, normalize, LUFS, spectrum, plugins"
keywords = ["audio", "dsp", "phonon", "lufs", "eq"]
categories = ["multimedia::audio", "multimedia"]
readme = "README.md"

[features]
default = ["parallel", "simd"]
parallel = ["rayon"]
simd = []

[dependencies]
num-complex.workspace = true
num-traits.workspace = true
rayon = { workspace = true, optional = true }
rustfft.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "audio_algorithms"
harness = false

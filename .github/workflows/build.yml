name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config build-essential
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Check code format
        run: cargo fmt -- --check
      - name: Check the package for errors
        run: cargo check --workspace --exclude phonon-studio
      - name: Lint rust sources
        run: cargo clippy --workspace --exclude phonon-studio --all-targets --tests --benches -- -D warnings
      - name: Lint phonon-core SIMD scalar fallback (wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p phonon-core --lib --no-default-features --features simd --target wasm32-unknown-unknown -- -D warnings
      - name: Execute rust tests
        run: cargo nextest run --workspace --exclude phonon-studio
      - name: Execute phonon-io tests with the aac feature
        run: cargo nextest run -p phonon-io --features aac
      - name: Execute doc tests
        run: cargo test --doc --workspace --exclude phonon-studio
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.git-cliff.outputs.content }}

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version "^0.13"
      - name: Build phonon-wasm
        run: ./phonon-wasm/build.sh

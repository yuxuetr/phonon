[package]
name = "phonon-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "VST3 / CLAP plugin compatibility layer for Phonon — wraps a DspPlugin into a host-friendly manifest and (eventually) a loadable plugin binary"
keywords = ["audio", "vst3", "clap", "plugin", "phonon"]
categories = ["multimedia::audio"]
publish = false

[lib]
# `cdylib` is required by both VST3 and CLAP hosts; `rlib` keeps the
# crate usable as a normal Rust library so manifest helpers can be
# unit-tested without going through the FFI layer.
crate-type = ["cdylib", "rlib"]

[dependencies]
phonon-core.workspace = true

[features]
default = []
# Future feature gates for the actual host SDK integrations.
# Enabling either pulls in the corresponding (currently external)
# bindings; keep them off by default so `cargo test --workspace`
# stays cheap.
clap = []
vst3 = []

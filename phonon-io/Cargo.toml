[package]
name = "phonon-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Audio file I/O for Phonon: read/write WAV/MP3/FLAC/OGG/AAC, ID3v2 podcast tags, FLAC/Vorbis comments"
keywords = ["audio", "mp3", "flac", "id3", "phonon"]
categories = ["multimedia::audio", "multimedia::encoding"]

[dependencies]
phonon-core.workspace = true
phonon-wav.workspace = true
thiserror.workspace = true
tracing.workspace = true
symphonia.workspace = true
mp3lame-encoder.workspace = true
flacenc.workspace = true
vorbis_rs.workspace = true
fdk-aac = { workspace = true, optional = true }
id3.workspace = true
metaflac.workspace = true

[features]
# AAC encoding via fdk-aac. Off by default: the bundled libfdk-aac is under
# the Fraunhofer FDK license (not OSI-approved, with patent caveats), so
# downstream crates must opt in explicitly. Decoding AAC (Symphonia) is
# unaffected.
aac = ["dep:fdk-aac"]

[package.metadata.docs.rs]
all-features = true

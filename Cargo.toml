[workspace]
members = ["phonon-cli","phonon-core", "phonon-engine",
    "phonon-wav", "phonon-studio", "phonon-io",
    "phonon-ai",
    "phonon-podcast",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuxuetr/phonon"

[workspace.dependencies]
# Internal crates
phonon-core = { path = "phonon-core", version = "0.1.0" }
phonon-wav = { path = "phonon-wav", version = "0.1.0" }
phonon-io = { path = "phonon-io", version = "0.1.0" }
phonon-engine = { path = "phonon-engine", version = "0.1.0" }
phonon-ai = { path = "phonon-ai", version = "0.1.0" }
phonon-podcast = { path = "phonon-podcast", version = "0.1.0" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1"

# Audio
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }
mp3lame-encoder = "0.2"
msedge-tts = "0.3"

# Math / DSP
num-complex = "0.4.6"
num-traits = "0.2.19"
rustfft = "6.4.1"

# CLI
clap = { version = "4.4", features = ["derive"] }

# GUI
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-logger = "0.7"
rfd = "0.15"

# Misc
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
members = ["phonon-cli","phonon-core", "phonon-engine",
    "phonon-wav", "phonon-studio", "phonon-io",
    "phonon-ai",
    "phonon-podcast",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuxuetr/phonon"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

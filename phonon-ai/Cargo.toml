[package]
name = "phonon-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AI-powered audio generation for Phonon (TTS, STT)"

[dependencies]
phonon-core = { path = "../phonon-core", version = "0.1.0" }
phonon-io = { path = "../phonon-io", version = "0.1.0" }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
bytes = "1"
tempfile = "3"

[package]
name = "phonon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
phonon-core = { path = "../phonon-core", version = "0.1.0" }
phonon-wav = { path = "../phonon-wav", version = "0.1.0" }
phonon-io = { path = "../phonon-io", version = "0.1.0" }
phonon-engine = { path = "../phonon-engine", version = "0.1.0" }
phonon-ai = { path = "../phonon-ai", version = "0.1.0" }
phonon-podcast = { path = "../phonon-podcast", version = "0.1.0" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
